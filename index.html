<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f5f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Volley Teams"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>Volley Team Builder</title></head><body>
<div id="gate" class="overlay hidden"><form id="unlockForm" class="gate"><h1>Volley Team Builder</h1><input id="unlockCode" type="password" placeholder="Passcode" autocomplete="current-password" required><button>Unlock</button></form></div>
<header><div><h1>Volley Team Builder</h1><small id="status">Version 1.5</small><small id="rosterStamp" class="roster-stamp">Roster: Existing local data</small></div></header>
<nav><button data-tab="session" class="active">Session</button><button data-tab="teams">Teams</button><button data-tab="players">Players</button><button data-tab="settings">Settings</button></nav>
<main>
<section id="session" class="tab active"><div class="toolbar"><label>Courts <select id="courts"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label><b><span id="selectedCount">0</span> selected</b></div><div class="toolbar left"><button id="selectAll" class="secondary">Select all</button><button id="clearAll" class="secondary">Clear</button></div><div id="playerChecks" class="player-grid"></div><div class="bottom"><button id="createTeams">Create balanced teams</button></div></section>
<section id="teams" class="tab"><div id="teamNotice" class="notice">Select players, then create teams.</div><div id="availability" class="notice hidden"></div><div id="teamGrid" class="team-grid"></div><div class="bottom split"><button id="reshuffle" class="secondary">Reshuffle unlocked</button><button id="publish">Publish</button></div></section>
<section id="players" class="tab"><div class="player-actions"><button id="filterBtn" class="secondary">Filters</button><button id="addNewBtn">Add New</button></div><div id="filterPanel" class="card hidden"><div class="filter-head"><h2>Filter players</h2><button id="closeFilters" class="secondary">Close</button></div><input id="filterName" placeholder="Search first or last name"><fieldset><legend>Rating</legend><div id="filterRatings" class="chips"><label class="chip"><input type="checkbox" value="1">1.0–1.9</label><label class="chip"><input type="checkbox" value="2">2.0–2.9</label><label class="chip"><input type="checkbox" value="3">3.0–3.9</label><label class="chip"><input type="checkbox" value="4">4.0–4.9</label><label class="chip"><input type="checkbox" value="5">5.0–6.0</label></div></fieldset><fieldset><legend>Designation</legend><div id="filterGender" class="chips"><label class="chip"><input type="checkbox" value="M">M</label><label class="chip"><input type="checkbox" value="F">F</label><label class="chip"><input type="checkbox" value="blank">Blank</label></div></fieldset><fieldset><legend>Tags</legend><div id="filterTags" class="chips"></div><label>Tag match <select id="filterTagMode"><option value="any">Any selected tag</option><option value="all">All selected tags</option></select></label></fieldset><fieldset><legend>Assessment / session</legend><div id="filterSpecial" class="chips"><label class="chip"><input type="checkbox" value="defaultRating">Default rating</label><label class="chip"><input type="checkbox" value="noTags">No tags</label><label class="chip"><input type="checkbox" value="selected">Selected</label><label class="chip"><input type="checkbox" value="notSelected">Not selected</label></div></fieldset><div class="toolbar"><button id="clearFilters" class="secondary">Clear All</button><button id="applyFilters">Show Players</button></div></div><div id="activeFilters" class="filter-summary hidden"></div><form id="playerForm" class="card form-grid hidden"><input id="firstName" placeholder="First name" required><input id="lastName" placeholder="Last name (optional)"><label>Rating<input id="rating" type="number" min="1" max="6" step="0.1" value="3.0" required></label><label>Designation<select id="gender"><option value="">Blank</option><option value="M">M</option><option value="F">F</option></select></label><fieldset><legend>Strength tags</legend><div id="tagInputs" class="chips"></div></fieldset><input id="editId" type="hidden"><button id="savePlayer">Add player</button><button id="cancelEdit" type="button" class="secondary hidden">Cancel</button></form><div class="toolbar backup-toolbar"><button id="exportBtn" class="secondary">Export backup</button><label class="button secondary">Import roster<input id="importFile" type="file" accept="application/json" hidden></label></div><div id="rosterImportDetail" class="import-detail">Current roster: Existing local data</div><div id="rosterList"></div></section>
<section id="settings" class="tab"><div class="card settings"><label>3-player adjustment<input id="threeAdj" type="number" min="0" max="1" step="0.05" value="0.25"></label><button id="saveSettings">Save settings</button><hr><h2>Passcode</h2><input id="newCode" type="password" placeholder="New passcode"><button id="setCode">Set / change</button><button id="removeCode" class="danger">Remove</button></div></section>
</main>
<div id="publishView" class="publish hidden"><div class="publish-head"><h1>Volleyball Teams</h1><button id="closePublish" class="secondary">Back</button></div><div id="publishedTeams" class="published-grid"></div></div><div id="toast" class="toast hidden"></div><script src="app.js"></script></body></html>
