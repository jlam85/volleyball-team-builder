name: Validate static app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check application JavaScript
        run: node --check app.js
      - name: Check service worker JavaScript
        run: node --check sw.js
      - name: Validate web manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
